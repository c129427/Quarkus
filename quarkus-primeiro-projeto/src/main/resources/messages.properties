# Sucesso
MSG001=Operação realizada com sucesso.
MSG002=Registro cadastrado com sucesso.
MSG003=Registro atualizado com sucesso.
MSG004=Registro excluído com sucesso.

# Validação
VAL001=O campo {0} é obrigatório.
VAL002=O campo {0} possui um valor inválido.
VAL003=O campo {0} deve possuir no máximo {1} caracteres.

# Negócio
NEG001=Registro não encontrado.
NEG002=O registro informado já existe.
NEG003=Não foi possível realizar a operação solicitada.
NEG004=O registro não pode ser excluído porque possui dependências.

# Autenticação e autorização
AUT001=Usuário não autenticado.
AUT002=Usuário não autorizado a realizar esta operação.

# Erros
ERR001=Ocorreu um erro interno ao processar a solicitação.
ERR002=Não foi possível acessar o banco de dados.
